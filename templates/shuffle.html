<!DOCTYPE html>
<html>
<head>
    <title>Shuffle My Pile</title>
</head>
<body>
    <h1>Shuffle My Pile</h1>

    {% if book %}
        <h2>{{ book[1] }}</h2>
        <p>by {{ book[2] }}</p>
    {% else %}
        <p>No TBR books yet. <a href="/add">Add one</a>.</p>
    {% endif %}

    <a href="/shuffle">Shuffle again</a> | <a href="/">Back to my books</a>
</body>
</html>

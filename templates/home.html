<!DOCTYPE html>
<html>
    <head>
        <title>My Book App</title>
    </head>
    <body>
        <h1>My Books</h1>
        <a href="/add">Add a new Book</a>
        <ul>
            {% for book in books %}
                <li>{{ book[1] }} by {{ book[2] }} - {{ book[3] }}</li>
            {% endfor %}
        </ul>
    </body>
</html>
